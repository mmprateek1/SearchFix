services:
  - type: web
    name: searchfix-api
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: GEMINI_COMMENT_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_DOCUMENT_MODEL
        value: gemini-3.5-flash
      - key: ALLOWED_GEMINI_KEY_HASHES
        sync: false
